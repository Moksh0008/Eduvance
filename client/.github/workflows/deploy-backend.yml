name: Deploy Backend to Render

on:
  push:
    branches: [cursor/frontend-adaptive-loop, main]
    paths:
      - 'client/server/**'
      - 'client/.github/workflows/deploy-backend.yml'

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}

jobs:
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render deploy
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          echo "Triggering Render deploy..."
          RESPONSE=$(curl -s -X POST \
            "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "false"}')
          echo "Deploy response: $RESPONSE"
          
          DEPLOY_ID=$(echo $RESPONSE | jq -r '.id // empty')
          if [ -z "$DEPLOY_ID" ]; then
            echo "⚠️ Could not trigger deploy. Make sure RENDER_API_KEY and RENDER_SERVICE_ID secrets are set."
            echo "Skipping — Render auto-deploy will handle it if connected via Blueprint."
          else
            echo "✅ Deploy triggered: $DEPLOY_ID"
          fi

      - name: Wait for deploy to finish
        if: env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: sleep 60

      - name: Health check
        run: |
          RENDER_URL="https://eduvance-api.onrender.com"
          echo "Checking health at $RENDER_URL/api/health ..."
          
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -w "\n%{http_code}" "$RENDER_URL/api/health" 2>/dev/null)
            HTTP_CODE=$(echo "$RESPONSE" | tail -1)
            BODY=$(echo "$RESPONSE" | head -1)
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Backend is healthy!"
              echo "$BODY" | jq . 2>/dev/null || echo "$BODY"
              exit 0
            fi
            
            echo "Attempt $i: HTTP $HTTP_CODE — retrying in 10s..."
            sleep 10
          done
          
          echo "⚠️ Health check failed after 5 attempts. Backend may still be starting up (Render free tier takes ~30s to wake)."

  verify-frontend:
    name: Verify Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend
        working-directory: client
        run: npm run build

      - name: Verify server syntax
        working-directory: client/server
        run: |
          for f in app.js routes/*.js services/*.js models/*.js controllers/*.js middleware/*.js; do
            node --check "$f" 2>&1 && echo "✅ $f" || echo "❌ $f"
          done
